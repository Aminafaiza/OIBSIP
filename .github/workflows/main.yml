
name: Deploy OIBSIP Projects

on:
  push:
    branches:
      - main
    paths:
      - 'WebDev-L1-LandingPage/**'
      - 'WebDev-L1-PersonalPortfolio/**'
      - 'WebDev-L1-TemperatureConverter/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare website files
        run: |
          mkdir -p site/landing-page
          mkdir -p site/temperature-converter

          cp -R WebDev-L1-LandingPage/. site/landing-page/
          cp -R WebDev-L1-PersonalPortfolio/. site/
          cp -R WebDev-L1-TemperatureConverter/. site/temperature-converter/

          echo "Checking deployment files..."
          test -f site/index.html
          test -f site/landing-page/index.html
          test -f site/temperature-converter/index.html

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
