
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <div class="converter-card">

            <h1>Temperature Converter</h1>
            <p class="subtitle">
                Convert temperatures quickly and easily.
            </p>

            <form id="converterForm">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                    step="any"
                >

                <label for="unit">Select Input Unit</label>

                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>

                <button type="submit">Convert Temperature</button>

            </form>

            <p id="errorMessage" class="error"></p>

            <section id="results" class="results" aria-live="polite" hidden>
                <h2>Conversion Results</h2>

                <div class="result-item">
                    <span>Celsius</span>
                    <strong id="celsiusResult">--</strong>
                </div>

                <div class="result-item">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">--</strong>
                </div>

                <div class="result-item">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">--</strong>
                </div>
            </section>

        </div>
    </main>

</body>
</html>
